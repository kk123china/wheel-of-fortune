<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0612">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="幸运转盘">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-TileColor" content="#0a0612">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="description" content="一个精美的交互式转盘工具，支持自定义选项、智能推荐、随机决策。让命运帮你做决定！">
    <meta name="keywords" content="转盘,抽奖,随机选择,决策工具,幸运轮盘,wheel of fortune">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="幸运转盘 · Carnival Wheel">
    <meta property="og:description" content="霓虹嘉年华风格的交互式转盘，让命运帮你做决定！">

    <title>幸运转盘 · Carnival Wheel</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

    <!-- 侧边抽屉菜单（从右侧滑出） -->
    <div class="drawer-overlay" id="drawerOverlay" aria-hidden="true"></div>
    <aside class="drawer-panel" id="drawerPanel" role="dialog" aria-label="菜单" aria-hidden="true">
        <div class="drawer-header">
            <span class="drawer-title">菜单</span>
            <button class="icon-btn drawer-close" id="drawerClose" title="关闭" aria-label="关闭菜单">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <div class="drawer-section">
            <div class="drawer-section-title">历史转盘</div>
            <div class="drawer-history" id="drawerHistory">
                <!-- JS 动态渲染最多10条历史转盘配置 -->
            </div>
        </div>

        <div class="drawer-divider"></div>

        <div class="drawer-section">
            <div class="drawer-link" id="linkGithub" role="button" tabindex="0">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2 0 1.9 1.2 1.9 1.2 1.1 1.9 2.9 1.4 3.6 1 .1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.4-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.8 1.1.8 2.2v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"/></svg>
                <span>GitHub 源码</span>
            </div>
            <div class="drawer-link" id="linkFeedback" role="button" tabindex="0">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>问题反馈</span>
            </div>
        </div>

        <div class="drawer-footer">
            <span class="drawer-copyright">© KK</span>
        </div>
    </aside>

    <!-- 撒花粒子容器 -->
    <canvas id="confettiCanvas"></canvas>

    <!-- 背景装饰层 -->
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- 顶部工具栏 -->
    <div class="topbar">
        <div class="brand">
            <span class="brand-icon" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2a10 10 0 0 1 10 10"/>
                    <path d="M12 2a10 10 0 0 0-10 10"/>
                    <path d="M12 12l7-7"/>
                    <path d="M12 12l-7-7"/>
                    <path d="M12 12l7 7"/>
                    <path d="M12 12l-7 7"/>
                </svg>
            </span>
            <span class="brand-title">幸运转盘</span>
            <span class="brand-sub">Carnival Wheel</span>
        </div>
        <div class="topbar-actions">
            <button class="icon-btn" id="soundToggle" title="音效" aria-label="音效开关">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
            <button class="icon-btn" id="themeToggle" title="主题" aria-label="主题切换">
                <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <!-- 三条横线菜单按钮（不是汉堡！纯三条水平平行线 ≡） -->
            <button class="icon-btn menu-btn" id="menuBtn" title="菜单" aria-label="打开菜单" aria-expanded="false">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
        </div>
    </div>

    <main class="main">
        <!-- 转盘区 -->
        <section class="stage">
            <div class="wheel-frame" id="wheelContainer">
                <div class="wheel-ring"></div>
                <canvas id="wheelCanvas"></canvas>
                <button class="center-btn" id="spinCenterBtn" title="点击开始">
                    <span class="center-inner">GO</span>
                </button>
                <div class="pointer" id="pointer">
                    <div class="pointer-ball"></div>
                    <div class="pointer-tip"></div>
                </div>
                <div class="neon-ring"></div>
            </div>

            <button class="spin-button" id="spinButton" disabled>
                <span class="spin-text">开始转动</span>
                <span class="spin-glow"></span>
            </button>
        </section>

        <!-- 控制面板 -->
        <section class="panels">

            <!-- 选项管理 -->
            <div class="panel">
                <div class="panel-head">
                    <span class="panel-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                    </span>
                    <h3>选项管理</h3>
                </div>
                <div class="input-group">
                    <input type="text" id="optionInput" placeholder="输入新选项..." maxlength="20">
                    <button id="addOptionBtn" class="btn-neon">添加</button>
                </div>
                <div class="options-list" id="optionsList"></div>
                <p class="hint-text" id="hintText">至少添加 2 个选项</p>
            </div>

            <!-- 预设模板 -->
            <div class="panel">
                <div class="panel-head">
                    <span class="panel-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    </span>
                    <h3>预设模板</h3>
                </div>
                <select id="templateSelect">
                    <option value="">-- 选一个模板 --</option>
                    <option value="lunch">午餐选择</option>
                    <option value="dinner">晚餐选择</option>
                    <option value="breakfast">早餐选择</option>
                    <option value="task">任务分配</option>
                    <option value="number">数字抽奖 1-8</option>
                    <option value="number100">数字抽奖 1-100</option>
                    <option value="yesno">是 / 否决定</option>
                    <option value="coin">抛硬币（正 / 反）</option>
                    <option value="date">约会地点</option>
                    <option value="drink">喝什么</option>
                    <option value="game">玩什么游戏</option>
                </select>
            </div>

            <!-- 智能推荐 -->
            <div class="panel panel-glow">
                <div class="panel-head">
                    <span class="panel-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </span>
                    <h3>智能推荐</h3>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="输入关键词：美食、电影、旅游...">
                    <button id="searchBtn" class="btn-neon">搜索</button>
                </div>
                <div class="hot-tags">
                    <button class="tag-btn" data-category="美食">美食</button>
                    <button class="tag-btn" data-category="电影">电影</button>
                    <button class="tag-btn" data-category="音乐">音乐</button>
                    <button class="tag-btn" data-category="旅游">旅游</button>
                    <button class="tag-btn" data-category="运动">运动</button>
                    <button class="tag-btn" data-category="游戏">游戏</button>
                    <button class="tag-btn" data-category="学习">学习</button>
                    <button class="tag-btn" data-category="购物">购物</button>
                </div>
                <div class="recommend-results" id="recommendResults">
                    <p class="placeholder-text">点热门标签或输入关键词</p>
                </div>
                <div class="batch-actions" id="batchActions" style="display:none;">
                    <button class="btn-import-all" id="importAllBtn">全部导入</button>
                    <button class="btn-clear-recommend" id="clearRecommendBtn">清空推荐</button>
                </div>
            </div>

            <!-- 自定义设置 -->
            <div class="panel">
                <div class="panel-head">
                    <span class="panel-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </span>
                    <h3>自定义设置</h3>
                </div>
                <div class="setting-item">
                    <label for="sizeSlider">转盘大小：<b id="sizeValue">300</b> px</label>
                    <input type="range" id="sizeSlider" min="200" max="420" value="300">
                </div>
                <div class="setting-item">
                    <label for="colorScheme">配色方案：</label>
                    <select id="colorScheme">
                        <option value="default">默认多彩</option>
                        <option value="carnival">嘉年华霓虹</option>
                        <option value="warm">暖色调</option>
                        <option value="cool">冷色调</option>
                        <option value="macaron">马卡龙</option>
                        <option value="gold">金色奢华</option>
                        <option value="rainbow">彩虹</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="durationSlider">旋转时长：<b id="durationValue">5</b> 秒</label>
                    <input type="range" id="durationSlider" min="2" max="10" value="5" step="0.5">
                </div>
                <div class="setting-item">
                    <label>功能：</label>
                    <div class="toggle-row">
                        <label class="toggle"><input type="checkbox" id="confettiToggle" checked><span class="toggle-track"></span><span class="toggle-label">撒花特效</span></label>
                        <label class="toggle"><input type="checkbox" id="historyToggle" checked><span class="toggle-track"></span><span class="toggle-label">历史记录</span></label>
                    </div>
                </div>
            </div>

            <!-- 历史记录 -->
            <div class="panel" id="historyPanel">
                <div class="panel-head">
                    <span class="panel-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                    </span>
                    <h3>历史记录</h3>
                    <button class="link-btn" id="clearHistoryBtn">清空</button>
                </div>
                <div class="history-list" id="historyList">
                    <p class="placeholder-text">还没有抽奖记录</p>
                </div>
            </div>

        </section>
    </main>

    <!-- 结果弹窗 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <div class="result-badge" aria-hidden="true">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </div>
            <h2 class="result-title">恭喜幸运儿！</h2>
            <div class="result-card">
                <p class="result-text" id="resultText"></p>
            </div>
            <div class="modal-actions">
                <button class="modal-button" id="closeModalBtn">再转一次</button>
                <button class="modal-button ghost" id="copyResultBtn">复制结果</button>
            </div>
        </div>
    </div>

    <!-- 菜单抽屉遮罩 -->
    <div class="drawer-overlay" id="drawerOverlay" hidden></div>

    <!-- 右侧抽屉面板 -->
    <aside class="drawer-panel" id="drawerPanel" hidden aria-hidden="true" aria-label="菜单">
        <!-- 抽屉头部 -->
        <header class="drawer-header">
            <h2 class="drawer-title">菜单</h2>
            <button class="drawer-close" id="drawerClose" aria-label="关闭菜单">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </header>

        <div class="drawer-body">
            <!-- ① 保存当前转盘 -->
            <section class="drawer-section">
                <button class="drawer-save-btn" id="saveCurrentBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    保存当前转盘
                </button>
            </section>

            <!-- ② 历史转盘列表 -->
            <section class="drawer-section">
                <h3 class="drawer-section-title">
                    历史转盘
                    <span class="drawer-count" id="presetCount">0 / 10</span>
                </h3>
                <div class="preset-list" id="presetList">
                    <!-- 空状态 -->
                    <div class="preset-empty" id="presetEmpty">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                            <path d="M21 3v5h-5"/>
                        </svg>
                        <p>还没有保存过转盘</p>
                        <p class="hint">点击上方按钮保存当前配置</p>
                    </div>
                    <!-- JS 渲染 preset-card 到这里 -->
                </div>
            </section>

            <!-- ③ 快捷链接 -->
            <section class="drawer-section">
                <h3 class="drawer-section-title">关于</h3>
                <a class="drawer-link" id="githubLink" href="https://github.com/kk123china/wheel-of-fortune" target="_blank" rel="noopener">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 .5C5.73.5.68 5.55.68 11.82c0 5.02 3.24 9.27 7.75 10.77.57.1.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.15.68-3.81-1.35-3.81-1.35-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.33.96.1-.75.4-1.25.72-1.54-2.51-.28-5.15-1.26-5.15-5.6 0-1.24.45-2.26 1.18-3.06-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.15 1.17.91-.25 1.89-.38 2.86-.39.97.01 1.95.14 2.86.39 2.19-1.48 3.15-1.17 3.15-1.17.62 1.57.23 2.73.11 3.02.74.8 1.18 1.82 1.18 3.06 0 4.35-2.65 5.32-5.17 5.59.41.36.78 1.05.78 2.11 0 1.52-.01 2.75-.01 3.12 0 .31.21.66.79.55 4.5-1.5 7.74-5.75 7.74-10.77C23.32 5.55 18.27.5 12 .5z"/>
                    </svg>
                    <span>GitHub 源码</span>
                    <svg class="link-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/></svg>
                </a>
                <a class="drawer-link" id="feedbackLink" href="https://github.com/kk123china/wheel-of-fortune/issues" target="_blank" rel="noopener">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>问题反馈</span>
                    <svg class="link-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/></svg>
                </a>
            </section>
        </div>

        <!-- 抽屉内 KK 版权 -->
        <footer class="drawer-footer">
            <span class="kk-logo">KK</span>
            <span class="kk-copy">© 2026 幸运转盘</span>
        </footer>
    </aside>

    <!-- 底部横幅（移到最后，缩小显示） -->
    <div class="bottom-banner" aria-hidden="true">
        <script src="https://keepandroidopen.org/banner.js"></script>
    </div>

    <!-- 页面最底部 KK 版权 -->
    <footer class="site-footer">
        <span class="site-kk">© KK</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
